<style>
  /* Prototype-only chrome. Layout/positioning utilities only — every color, font-size, radius,
     and spacing value below is a var() reference into foundations.css's existing token set.
     No new colors, typography values, or component styles are introduced here. */
  /* Full-width bar above the sidebar (not beside it) — single row, never wraps. The extra width
     freed up by not being offset behind the sidebar is what makes one row actually fit; if a
     viewport is ever too narrow regardless, it scrolls horizontally rather than wrapping or clipping. */
  .proto-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    height: var(--space-12); box-sizing: border-box;
    display: flex; align-items: center; flex-wrap: nowrap; gap: var(--space-2);
    background: var(--bg-surface); border-bottom: 1px solid var(--border-strong);
    padding: 0 var(--space-6); overflow-x: auto;
  }
  .proto-hint {
    display: inline-flex; align-items: center; gap: var(--space-1); flex-shrink: 0;
    font-size: 12px; font-weight: var(--fw-medium); color: var(--text-disabled); cursor: default;
    padding-right: var(--space-4); margin-right: var(--space-2);
    border-right: 1px solid var(--border-subtle);
  }
  .proto-hint svg { width: 14px; height: 14px; stroke: var(--text-disabled); flex-shrink: 0; }
  /* Group titles ("Overview", "Actions", "Lifecycle"): quiet, uppercase, non-interactive text —
     deliberately NOT chip-shaped so they read as section headings, never as something to click.
     A left border on every group after the first draws a hard boundary between sections. */
  .proto-nav .proto-label {
    font-size: 12px; font-weight: var(--fw-semibold); color: var(--text-disabled);
    letter-spacing: 0.06em; text-transform: uppercase; cursor: default;
    padding-left: var(--space-4); margin-left: var(--space-2);
    border-left: 1px solid var(--border-subtle);
  }
  .proto-nav .proto-label:first-child { padding-left: 0; margin-left: 0; border-left: none; }
  /* Action links: styled as pill chips at rest (the same resting-chip language .filter-tab and
     .category-chip already use elsewhere in this system), so every clickable screen link is
     unmistakably a button, not a label, even before hover. */
  .proto-nav a {
    font-size: 12px; font-weight: var(--fw-medium); color: var(--text-secondary);
    background: var(--neutral-100); border: 1px solid transparent;
    padding: var(--space-1) var(--space-3); border-radius: var(--radius-badge); cursor: pointer;
  }
  .proto-nav a:hover { color: var(--text-brand); background: var(--bg-surface-selected); }
  .proto-nav a.active { color: var(--text-inverse); background: var(--blue-500); border-color: var(--blue-500); }
  .app-shell { padding-top: var(--space-12); }
  .breadcrumb[data-nav] { cursor: pointer; }
  .breadcrumb[data-nav]:hover { color: var(--text-brand); }
  /* .scrim/.drawer (foundations.css) are position:fixed, so .app-shell's padding-top above
     doesn't affect them — they still start at the very top of the viewport, under .proto-nav's
     higher z-index. Scoped here (not in foundations.css) because that .scrim rule is shared with
     the landing page's demo modal, which has no prototype nav bar to offset for. */
  #main-content .scrim { top: var(--space-12); }
</style>
